name: iOS CI

on:
  push:
    branches: [ main ]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ios
        run: xcodegen generate

      - name: Build simulator target
        working-directory: ios
        run: |
          xcodebuild             -project SafeCircleIOS.xcodeproj             -scheme SafeCircleIOS             -sdk iphonesimulator             -destination 'platform=iOS Simulator,name=iPhone 16'             CODE_SIGNING_ALLOWED=NO             build
