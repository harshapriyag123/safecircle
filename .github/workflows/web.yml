name: Website CI
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r backend/requirements.txt
      - run: npm install --no-save --prefix web/tests playwright@1.55.1
      - run: web/tests/node_modules/.bin/playwright install --with-deps chromium
      - name: Start isolated test server
        run: |
          PYTHONPATH=backend SAFECIRCLE_DB_PATH=/tmp/site-ci.db python -m uvicorn backend.app.entrypoint:app --port 8080 > /tmp/site-ci.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/site-ci.log
          exit 1
      - run: node --test scheduler/cloudflare/worker.test.mjs
      - run: node web/tests/site.cjs
      - run: node web/tests/companion.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: safecircle-website-screenshots
          path: web/site/assets/*.png
          if-no-files-found: error
