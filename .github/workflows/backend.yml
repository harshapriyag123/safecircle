name: Backend CI

on:
  push:
    branches: [ main ]
    paths:
      - "backend/**"
      - "scheduler/cloudflare/**"
      - "app.py"
      - "vercel.json"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "backend/**"
      - "scheduler/cloudflare/**"
      - "app.py"
      - "vercel.json"
      - ".github/workflows/backend.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        storage: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: safecircle_test
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: safecircle_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Test API
        env:
          PYTHONPATH: .
          SAFECIRCLE_ALLOW_DEMO_TOKEN: "true"
          SAFECIRCLE_TEST_DATABASE_URL: ${{ matrix.storage == 'postgres' && 'postgresql://safecircle_test:isolated_ci_only@localhost:5432/safecircle_test' || '' }}
        run: pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test minute scheduler adapter
        run: node --test ../scheduler/cloudflare/worker.test.mjs
