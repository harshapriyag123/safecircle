name: SafeCircleIOS
options:
  bundleIdPrefix: com.harshapriya
settings:
  base:
    SWIFT_VERSION: 5.9
packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios.git
    exactVersion: 5.16.0
targets:
  SafeCircleIOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - SafeCircleIOS
    dependencies:
      - package: RevenueCat
        product: RevenueCat
      - package: RevenueCat
        product: RevenueCatUI
    settings:
      base:
        REVENUECAT_PUBLIC_SDK_KEY: ""
        INFOPLIST_KEY_RevenueCatPublicSDKKey: $(REVENUECAT_PUBLIC_SDK_KEY)
        PRODUCT_BUNDLE_IDENTIFIER: com.harshapriya.safecircle.ios
        INFOPLIST_KEY_CFBundleDisplayName: SafeCircle
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: SafeCircle uses location only for active Safety Sessions you start.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    scheme:
      testTargets: []
