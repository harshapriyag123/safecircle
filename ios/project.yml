name: SafeCircleIOS
options:
  bundleIdPrefix: com.harshapriya
settings:
  base:
    SWIFT_VERSION: 5.9
targets:
  SafeCircleIOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - SafeCircleIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harshapriya.safecircle.ios
        INFOPLIST_KEY_CFBundleDisplayName: SafeCircle
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: SafeCircle uses location only for active Safety Sessions you start.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    scheme:
      testTargets: []
